<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Filder Defense</title>
<meta name="theme-color" content="#141a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Filder Defense">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: eine Spalte, HUD oben (mit Tempo-Taste rechts), Spielfeld mittig, Bauleiste unten in zwei Reihen. */
:root{
  --bg:#141a12; --panel:#1f2a1c; --line:#3a4a32; --fg:#e9eedf; --muted:#9fae92;
  --accent:#f2b134; --danger:#e0574f; --good:#8fd16b; --hero:#6cc4d9;
  --font:ui-rounded, -apple-system, "SF Pro Rounded", system-ui, "Segoe UI", sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;touch-action:manipulation;-webkit-touch-callout:none;background:var(--bg);color:var(--fg);font-family:var(--font);
  padding-inline:16px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px;user-select:none;-webkit-user-select:none}
.hud{width:100%;max-width:420px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;align-items:flex-start;flex:1 1 0}
.stat b{font-size:20px}
.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wrap{position:relative;width:min(100%, 420px, calc((100dvh - 290px) * 2 / 3));aspect-ratio:2/3}
canvas{width:100%;height:100%;display:block;border-radius:10px;border:1px solid var(--line);touch-action:none}
.bar{width:100%;max-width:420px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font-family:var(--font);font-size:14px;font-weight:700;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:10px 12px;cursor:pointer;min-width:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
button small{display:block;font-weight:500;color:var(--muted);font-size:11px}
#speed{flex:0 0 auto;min-width:56px;font-size:16px;padding:8px 10px}
#speed.fast{border-color:var(--accent);color:var(--accent)}
#go{background:var(--accent);color:#1b1407;border-color:var(--accent)}
#go small{color:#4a3a14}
#go:disabled{opacity:.45;cursor:default}
#go{display:flex;align-items:center;justify-content:center;gap:10px;text-align:left}
.ring{--p:0;flex:0 0 auto;width:26px;height:26px;border-radius:50%;
  background:conic-gradient(#1b1407 calc(var(--p)*360deg), rgba(27,20,7,.22) 0);
  -webkit-mask:radial-gradient(circle, transparent 7px, #000 8px);mask:radial-gradient(circle, transparent 7px, #000 8px)}
#auto.on{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
#auto.on b{color:var(--good)}
.tpanel{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(20,26,18,.94);border:1px solid var(--accent);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.tpanel.top{bottom:auto;top:8px}
.tpinfo{font-size:13px;font-variant-numeric:tabular-nums}
.tpinfo b{font-size:15px;color:var(--accent)}
.tpinfo span{color:var(--muted)}
.tpbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#tpUp{background:var(--accent);color:#1b1407;border-color:var(--accent)}
#tpUp:disabled{opacity:.45;cursor:default}
.herobar{width:100%;max-width:420px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 10px;font-size:13px}
.herobar b{color:var(--hero)}
.herobar .xp{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.herobar .xp i{display:block;height:100%;width:0;background:var(--hero)}
.herobar small{grid-column:1/-1;color:var(--muted);font-size:11px}
.hint{font-size:12px;color:var(--muted);text-align:center;max-width:420px}
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,14,9,.82);border-radius:10px;text-align:center;padding:16px}
.over h2{margin:0;font-size:28px;color:var(--accent)}
.over button{padding:12px 22px}
</style>
</head>
<body>

<div class="hud">
  <div class="stat"><b id="gold">0</b><span>Gold</span></div>
  <div class="stat"><b id="lives">0</b><span>Leben</span></div>
  <div class="stat"><b id="wave">0</b><span>Welle</span></div>
  <button id="speed" aria-label="Spieltempo">1×</button>
</div>
<div class="herobar">
  <span><b>Kommandant</b> <span id="heroLvl">Stufe 1</span></span>
  <div class="xp"><i id="xp"></i></div>
  <small id="heroPerk">Noch nicht platziert</small>
</div>

<div class="wrap">
  <canvas id="c"></canvas>
  <div class="tpanel" id="tpanel" hidden>
    <div class="tpinfo" id="tpInfo"></div>
    <div class="tpbtns"><button id="tpUp">Verbessern</button><button id="tpSell">Verkaufen</button></div>
  </div>
  <div class="over" id="over" hidden>
    <h2 id="overTitle">Verloren</h2>
    <div id="overText"></div>
    <button id="restart">Neu starten</button>
  </div>
</div>

<div class="bar">
  <button id="t-cannon" class="sel">Kanone<small>50 Gold · Einzelziel</small></button>
  <button id="t-mortar">Mörser<small>80 Gold · Flächenschaden</small></button>
  <button id="go"><span class="ring" id="ring" hidden></span><span><span id="goLabel">Welle starten</span><small id="goSub">Bauphase</small></span></button>
  <button id="auto"><b id="autoLabel">Dauerwelle: aus</b><small id="autoSub">Wellen ohne Pause · Bonus-Gold</small></button>
</div>
<div class="hint">Turm antippen: verbessern oder verkaufen. Türme im blauen Kreis des Kommandanten bekommen seine Boni. Früher Wellenstart bringt Bonus-Gold.</div>

<script>
(()=>{
const W=360,H=540,C=45,COLS=8,ROWS=12;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,3);
cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
const $=id=>document.getElementById(id);

const TYPES={
  cannon:{name:'Kanone',cost:50,up:[40,70],range:2.2*C,dmg:12,rate:.7,speed:320,splash:0,color:'#c9d4bb'},
  mortar:{name:'Mörser',cost:80,up:[60,100],range:2.8*C,dmg:18,rate:1.6,speed:200,splash:40,color:'#f2b134'}
};
const MAXLVL=3,SELL=0.7;
// Werte eines Turms je Stufe: pro Stufe +50 % Schaden, +10 % Reichweite, 10 % schneller
function stats(t){const T=TYPES[t.type],k=t.lvl-1,b=heroBuff(t);
  return {speed:T.speed,splash:T.splash*(1+.15*k),dmg:Math.round(T.dmg*Math.pow(1.5,k)*b.dmg),range:T.range*(1+.1*k)*b.range,rate:T.rate*Math.pow(.9,k)/b.rate,buffed:b.on};}

// Held: Kommandant. Stufen über Abschüsse, Passive wirken auf Türme in seiner Aura.
const HERO={aura:2.5*C,range:1.9*C,rate:.6,dmg:8,dmgPerLvl:5,levels:[0,15,40,80],
  perks:['Kämpft selbst mit','+15 % Feuerrate','+20 % Reichweite','+25 % Schaden']};
function heroBuff(t){
  const h=S&&S.hero,none={rate:1,range:1,dmg:1,on:false};
  if(!h||Math.hypot(t.x-h.x,t.y-h.y)>HERO.aura)return none;
  return {rate:h.lvl>=2?1.15:1,range:h.lvl>=3?1.2:1,dmg:h.lvl>=4?1.25:1,on:h.lvl>=2};
}
function heroKill(){const h=S.hero;if(!h)return;h.kills++;
  const L=HERO.levels;if(h.lvl<L.length&&h.kills>=L[h.lvl]){h.lvl++;floatText('Kommandant Stufe '+h.lvl+': '+HERO.perks[h.lvl-1],'#6cc4d9');}}
const WP=[[-1,1],[6,1],[6,4],[1,4],[1,7],[6,7],[6,10],[3,10],[3,12.5]];
const pts=WP.map(([x,y])=>({x:(x+.5)*C,y:(y+.5)*C}));
const segs=[];let total=0;
for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],l=Math.hypot(b.x-a.x,b.y-a.y);segs.push({a,b,l,s:total});total+=l;}
const pathCells=new Set();
for(let i=0;i<WP.length-1;i++){
  let [x1,y1]=WP[i],[x2,y2]=WP[i+1];y2=Math.min(y2,ROWS-1);
  const dx=Math.sign(x2-x1),dy=Math.sign(y2-y1);let x=x1,y=y1;
  while(true){if(x>=0&&y>=0&&x<COLS&&y<ROWS)pathCells.add(x+','+y);if(x===x2&&y===y2)break;x+=dx;y+=dy;}
}
function posAt(d){for(const s of segs){if(d<=s.s+s.l){const t=(d-s.s)/s.l;return{x:s.a.x+(s.b.x-s.a.x)*t,y:s.a.y+(s.b.y-s.a.y)*t};}}return pts[pts.length-1];}

const SPEEDS=[1,2,3];
let S,build='cannon',speedIdx=0;

function reset(){
  S={gold:120,lives:20,wave:0,towers:[],enemies:[],shots:[],fx:[],texts:[],queue:[],spawnT:0,auto:false,brk:null,sel:null,over:false,hero:null};
  $('over').hidden=true;hud();
}
function hud(){
  $('gold').textContent=S.gold;
  $('lives').textContent=S.lives;
  $('wave').textContent=S.wave;
  $('go').disabled=S.queue.length>0||S.over||S.auto||!S.hero;
  const h=S.hero;
  if(h){const L=HERO.levels,max=h.lvl>=L.length;
    $('heroLvl').textContent='Stufe '+h.lvl;
    $('xp').style.width=(max?100:Math.min(100,(h.kills-L[h.lvl-1])/(L[h.lvl]-L[h.lvl-1])*100))+'%';
    $('heroPerk').textContent=(max?'Höchste Stufe · ':h.kills+'/'+L[h.lvl]+' Abschüsse · nächster Bonus: '+HERO.perks[h.lvl]+' · ')+'Boni: '+HERO.perks.slice(1,h.lvl).join(', ').replace(/^$/,'noch keine');
  }else{$('heroLvl').textContent='Stufe 1';$('xp').style.width='0%';$('heroPerk').textContent='Tippe auf ein freies Feld, um den Kommandanten kostenlos zu setzen';}
  const tp=$('tpanel'),t=S.sel;
  if(t&&!S.over){
    const T=TYPES[t.type],st=stats(t);
    tp.hidden=false;tp.classList.toggle('top',t.cy>=ROWS/2);
    $('tpInfo').innerHTML='<b>'+T.name+' · Stufe '+t.lvl+'</b><br><span>Schaden '+st.dmg+' · Reichweite '+(st.range/C).toFixed(1).replace('.',',')+' · '+(1/st.rate).toFixed(1).replace('.',',')+' Schuss/s</span>';
    const max=t.lvl>=MAXLVL,cost=max?0:T.up[t.lvl-1];
    $('tpUp').textContent=max?'Maximale Stufe':'Verbessern · '+cost+' Gold';
    $('tpUp').disabled=max||S.gold<cost;
    $('tpSell').textContent='Verkaufen · +'+Math.floor(t.spent*SELL);
  }else tp.hidden=true;
  const ring=$('ring'),next=S.wave+1;
  if(S.brk&&!S.auto){
    const left=Math.max(0,S.brk.dur-S.brk.t);
    ring.hidden=false;ring.style.setProperty('--p',(left/S.brk.dur).toFixed(3));
    $('goLabel').textContent='Welle '+next+' in '+Math.ceil(left)+' s';
    $('goSub').textContent='Jetzt starten: +'+earlyBonus()+' Gold';
  }else{
    ring.hidden=true;
    $('goLabel').textContent='Welle starten';
    $('goSub').textContent=!S.hero?'Erst Held setzen':S.auto?'Dauerwelle läuft':S.queue.length?'Welle '+S.wave+' rückt an':S.enemies.length&&S.wave?'Sofort: +'+earlyBonus()+' Gold':'Bauphase';
  }
  $('auto').classList.toggle('on',S.auto);
  $('autoLabel').textContent=S.auto?'Dauerwelle: an':'Dauerwelle: aus';
  $('autoSub').textContent='Bonus ab Welle: +'+chainBonus(S.wave+1)+' Gold';
}
function chainBonus(n){return 10+5*n;}
const BREAK=15; // Sekunden Pause nach einer geschafften Welle
// Früher Start zahlt anteilig: je mehr Pause übrig ist, desto mehr Bonus
function earlyBonus(){const n=S.wave+1;if(!S.wave)return 0;const f=S.brk?1-S.brk.t/S.brk.dur:1;return Math.round(chainBonus(n)*f);}
function floatText(txt,color){S.texts.push({x:W/2,y:H*0.45,txt,color,t:0});}

function startWave(bonus){
  if(S.over)return;
  S.brk=null;
  S.wave++;const n=S.wave,count=6+2*n;
  for(let i=0;i<count;i++)S.queue.push({n,boss:i===count-1&&n%5===0});
  if(bonus>0){S.gold+=bonus;floatText('Welle '+n+' · +'+bonus+' Gold','#8fd16b');}
  else floatText('Welle '+n,'#e9eedf');
  if(S.spawnT<0)S.spawnT=0;
  hud();
}
function spawn(q){
  const hp=Math.round(20*Math.pow(1.28,q.n-1)*(q.boss?6:1));
  S.enemies.push({d:0,hp,max:hp,speed:(q.boss?32:48)+q.n*2.5,r:q.boss?14:9,reward:q.boss?40:5+Math.floor(q.n/2),x:pts[0].x,y:pts[0].y});
}

function update(dt){
  if(S.over)return;
  if(S.queue.length){S.spawnT-=dt;if(S.spawnT<=0){spawn(S.queue.shift());S.spawnT=.75;}}
  if(S.auto&&S.queue.length===0)startWave(chainBonus(S.wave+1));
  if(!S.auto&&S.wave>0&&!S.queue.length&&!S.enemies.length&&!S.brk)S.brk={t:0,dur:BREAK};
  if(S.brk&&!S.auto){S.brk.t+=dt;if(S.brk.t>=S.brk.dur)startWave(0);}
  for(const e of S.enemies){e.d+=e.speed*dt;const p=posAt(e.d);e.x=p.x;e.y=p.y;}
  S.enemies=S.enemies.filter(e=>{if(e.d>=total){S.lives--;return false;}return e.hp>0;});
  for(const t of S.towers){
    const T=stats(t);t.cd-=dt;
    let target=null;
    for(const e of S.enemies){if(Math.hypot(e.x-t.x,e.y-t.y)<=T.range&&(!target||e.d>target.d))target=e;}
    if(target){
      t.a=Math.atan2(target.y-t.y,target.x-t.x);
      if(t.cd<=0){t.cd=T.rate;t.flash=.08;
        S.shots.push({x:t.x+Math.cos(t.a)*16,y:t.y+Math.sin(t.a)*16,tg:target,tx:target.x,ty:target.y,T});}
    }
    if(t.flash>0)t.flash-=dt;
  }
  const h=S.hero;
  if(h){h.cd-=dt;
    let target=null;
    for(const e of S.enemies){if(Math.hypot(e.x-h.x,e.y-h.y)<=HERO.range&&(!target||e.d>target.d))target=e;}
    if(target){h.a=Math.atan2(target.y-h.y,target.x-h.x);
      if(h.cd<=0){h.cd=HERO.rate;target.hp-=HERO.dmg+HERO.dmgPerLvl*(h.lvl-1);
        S.fx.push({bolt:true,x:h.x,y:h.y,x2:target.x,y2:target.y,t:0});}}
  }
  for(const s of S.shots){
    if(s.tg.hp>0&&S.enemies.includes(s.tg)){s.tx=s.tg.x;s.ty=s.tg.y;}
    const dx=s.tx-s.x,dy=s.ty-s.y,dist=Math.hypot(dx,dy),step=s.T.speed*dt;
    if(dist<=step){s.hit=true;
      if(s.T.splash){for(const e of S.enemies)if(Math.hypot(e.x-s.tx,e.y-s.ty)<=s.T.splash)e.hp-=s.T.dmg;
        S.fx.push({x:s.tx,y:s.ty,r:4,max:s.T.splash,t:0});}
      else if(s.tg.hp>0){s.tg.hp-=s.T.dmg;S.fx.push({x:s.tx,y:s.ty,r:2,max:10,t:0});}
    }else{s.x+=dx/dist*step;s.y+=dy/dist*step;}
  }
  S.shots=S.shots.filter(s=>!s.hit);
  for(const e of S.enemies)if(e.hp<=0&&!e.paid){e.paid=true;S.gold+=e.reward;heroKill();}
  S.enemies=S.enemies.filter(e=>e.hp>0);
  for(const f of S.fx)f.t+=dt;S.fx=S.fx.filter(f=>f.t<.3);
  for(const t of S.texts)t.t+=dt;S.texts=S.texts.filter(t=>t.t<1.4);
  if(S.lives<=0){S.lives=0;S.over=true;S.auto=false;
    $('overTitle').textContent='Verloren';
    $('overText').textContent='Du hast bis Welle '+S.wave+' durchgehalten.';
    $('over').hidden=false;}
  hud();
}

function draw(){
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    ctx.fillStyle=pathCells.has(x+','+y)?'#a88d5f':((x+y)%2?'#2b3a25':'#2f3f28');
    ctx.fillRect(x*C,y*C,C,C);
  }
  ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=2;ctx.beginPath();
  pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
  if(S.sel){const T=stats(S.sel);ctx.fillStyle='rgba(242,177,52,.12)';ctx.strokeStyle='rgba(242,177,52,.6)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(S.sel.x,S.sel.y,T.range,0,7);ctx.fill();ctx.stroke();}
  const h=S.hero;
  if(h){ctx.fillStyle='rgba(108,196,217,.07)';ctx.strokeStyle='rgba(108,196,217,.45)';ctx.lineWidth=1.5;ctx.setLineDash([6,6]);
    ctx.beginPath();ctx.arc(h.x,h.y,HERO.aura,0,7);ctx.fill();ctx.stroke();ctx.setLineDash([]);}
  for(const t of S.towers){const T=TYPES[t.type];
    ctx.fillStyle='#4a5640';ctx.beginPath();ctx.roundRect(t.x-17,t.y-17,34,34,6);ctx.fill();
    if(heroBuff(t).on){ctx.strokeStyle='#6cc4d9';ctx.lineWidth=2;ctx.stroke();}
    ctx.fillStyle='#5d6b51';ctx.beginPath();ctx.arc(t.x,t.y,12,0,7);ctx.fill();
    ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.a);
    ctx.fillStyle=T.color;
    if(t.type==='mortar')ctx.fillRect(0,-6,14,12);else ctx.fillRect(0,-3,19,6);
    if(t.flash>0){ctx.fillStyle='#ffe28a';ctx.beginPath();ctx.arc(t.type==='mortar'?16:21,0,5,0,7);ctx.fill();}
    ctx.restore();
    ctx.fillStyle=T.color;ctx.beginPath();ctx.arc(t.x,t.y,6,0,7);ctx.fill();
    for(let i=0;i<t.lvl;i++){ctx.fillStyle='#f2b134';ctx.beginPath();ctx.arc(t.x-10+i*10,t.y+20,3,0,7);ctx.fill();}
  }
  if(h){
    ctx.fillStyle='#24424a';ctx.beginPath();ctx.arc(h.x,h.y,17,0,7);ctx.fill();
    ctx.strokeStyle='#6cc4d9';ctx.lineWidth=2.5;ctx.stroke();
    ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.a);ctx.fillStyle='#e9eedf';ctx.fillRect(4,-2,15,4);ctx.restore();
    // Krone
    ctx.fillStyle='#f2b134';ctx.beginPath();
    ctx.moveTo(h.x-8,h.y+4);ctx.lineTo(h.x-8,h.y-5);ctx.lineTo(h.x-4,h.y-1);ctx.lineTo(h.x,h.y-8);ctx.lineTo(h.x+4,h.y-1);ctx.lineTo(h.x+8,h.y-5);ctx.lineTo(h.x+8,h.y+4);ctx.closePath();ctx.fill();
    ctx.fillStyle='#6cc4d9';ctx.font='700 11px '+getComputedStyle(document.body).fontFamily;ctx.textAlign='center';
    ctx.fillText('Lv '+h.lvl,h.x,h.y+30);
  }else{
    ctx.fillStyle='rgba(20,26,18,.75)';ctx.fillRect(20,H/2-34,W-40,68);
    ctx.fillStyle='#6cc4d9';ctx.font='700 16px '+getComputedStyle(document.body).fontFamily;ctx.textAlign='center';
    ctx.fillText('Tippe auf ein freies Feld,',W/2,H/2-6);ctx.fillText('um den Kommandanten zu setzen',W/2,H/2+16);
  }
  for(const e of S.enemies){
    ctx.fillStyle='#e0574f';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(e.x-12,e.y-e.r-8,24,4);
    ctx.fillStyle='#8fd16b';ctx.fillRect(e.x-12,e.y-e.r-8,24*Math.max(0,e.hp/e.max),4);
  }
  for(const s of S.shots){ctx.fillStyle=s.T.splash?'#f2b134':'#f4f1e6';ctx.beginPath();ctx.arc(s.x,s.y,s.T.splash?5:3,0,7);ctx.fill();}
  for(const f of S.fx){const k=f.t/.3;
    if(f.bolt){ctx.strokeStyle='rgba(108,196,217,'+(1-k)+')';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x2,f.y2);ctx.stroke();continue;}
    ctx.strokeStyle='rgba(255,210,120,'+(1-k)+')';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(f.x,f.y,f.r+(f.max-f.r)*k,0,7);ctx.stroke();}
  ctx.textAlign='center';ctx.font='700 17px '+getComputedStyle(document.body).fontFamily;
  for(const t of S.texts){const k=t.t/1.4;ctx.globalAlpha=1-k*k;
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillText(t.txt,t.x+1,t.y-k*40+1);
    ctx.fillStyle=t.color;ctx.fillText(t.txt,t.x,t.y-k*40);ctx.globalAlpha=1;}
}

let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  const steps=SPEEDS[speedIdx];
  for(let i=0;i<steps;i++)update(dt);
  draw();requestAnimationFrame(loop);
}

cv.addEventListener('pointerdown',e=>{
  if(S.over)return;
  const r=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/r.width*W/C),y=Math.floor((e.clientY-r.top)/r.height*H/C);
  if(x<0||y<0||x>=COLS||y>=ROWS)return;
  const ex=S.towers.find(t=>t.cx===x&&t.cy===y);
  if(ex){S.sel=S.sel===ex?null:ex;hud();return;}
  if(S.sel){S.sel=null;hud();return;} // erst Menü schließen, nicht gleich bauen
  if(pathCells.has(x+','+y))return;
  if(!S.hero){S.hero={cx:x,cy:y,x:(x+.5)*C,y:(y+.5)*C,lvl:1,kills:0,cd:0,a:-Math.PI/2};
    floatText('Kommandant bereit','#6cc4d9');hud();return;}
  if(S.hero.cx===x&&S.hero.cy===y)return;
  const T=TYPES[build];if(S.gold<T.cost)return;
  S.gold-=T.cost;S.towers.push({type:build,cx:x,cy:y,x:(x+.5)*C,y:(y+.5)*C,cd:0,a:-Math.PI/2,flash:0,lvl:1,spent:T.cost});hud();
});
function pick(t){build=t;$('t-cannon').classList.toggle('sel',t==='cannon');$('t-mortar').classList.toggle('sel',t==='mortar');}
$('t-cannon').onclick=()=>pick('cannon');
$('t-mortar').onclick=()=>pick('mortar');
$('go').onclick=()=>{if(!S.queue.length&&!S.auto&&!S.over&&S.hero)startWave(earlyBonus());};
$('auto').onclick=()=>{if(S.over||!S.hero)return;S.auto=!S.auto;hud();};
$('speed').onclick=()=>{speedIdx=(speedIdx+1)%SPEEDS.length;$('speed').textContent=SPEEDS[speedIdx]+'×';$('speed').classList.toggle('fast',speedIdx>0);};
$('restart').onclick=reset;
$('tpUp').onclick=()=>{const t=S.sel;if(!t||t.lvl>=MAXLVL)return;const c=TYPES[t.type].up[t.lvl-1];
  if(S.gold<c)return;S.gold-=c;t.spent+=c;t.lvl++;hud();};
$('tpSell').onclick=()=>{const t=S.sel;if(!t)return;S.gold+=Math.floor(t.spent*SELL);
  S.towers=S.towers.filter(x=>x!==t);S.sel=null;hud();};

reset();requestAnimationFrame(loop);
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
